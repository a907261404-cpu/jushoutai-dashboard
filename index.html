<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>聚售台 · 销售看板</title>
<style>
  :root{ --bg:#f5f6f8; --card:#ffffff; --red:#e4393c; --green:#07a35a; --text:#1f2329; --sub:#8a9099; --line:#eef0f3; --blue:#3b6ef5; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; padding:env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom)); overflow-x:hidden; }
  .top{ display:flex; align-items:center; justify-content:space-between; padding:16px 4px 10px; }
  .top h1{ font-size:19px; margin:0; font-weight:700; }
  .dot{ width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;vertical-align:middle; }
  .dot.off{ background:#c9ccd1; }
  .sub{ font-size:12px;color:var(--sub); }
  .refresh{ border:none; background:var(--blue); color:#fff; font-size:13px; font-weight:600; padding:8px 14px; border-radius:10px; }
  .refresh:active{ opacity:.8; }
  .cards{ display:grid; grid-template-columns:1fr; gap:12px; }
  .card{ background:var(--card); border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .card .title{ font-size:13px;color:var(--sub);margin-bottom:10px; }
  .big{ display:flex; align-items:baseline; gap:8px; }
  .big .num{ font-size:30px; font-weight:800; color:var(--red); letter-spacing:-0.5px; }
  .big .unit{ font-size:14px;color:var(--sub); }
  .cnt{ font-size:13px;color:var(--sub);margin-top:6px; }
  .split{ display:flex; gap:10px; margin-top:12px; }
  .split > div{ flex:1; background:var(--bg); border-radius:10px; padding:10px; }
  .split .p{ font-size:12px;color:var(--sub); }
  .split .v{ font-size:16px;font-weight:700;margin-top:2px; }
  .section-t{ font-size:15px;font-weight:700;margin:18px 4px 8px; }
  .store{ background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px; box-shadow:0 1px 6px rgba(0,0,0,.03); display:flex; align-items:center; gap:10px; }
  .store .badge{ font-size:11px; font-weight:700; color:#fff; border-radius:7px; padding:3px 7px; flex:none; }
  .badge.douyin{ background:#2b2b3a; } .badge.pinduoduo{ background:#e23a3a; } .badge.taobao{ background:#ff5000; } .badge.other{ background:#8a9099; }
  .store .name{ flex:1; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .store .val{ text-align:right; }
  .store .amt{ font-size:15px; font-weight:800; color:var(--red); }
  .store .cnt{ font-size:11px; color:var(--sub); }
  .trend{ display:flex; align-items:flex-end; gap:4px; height:120px; overflow-x:auto; padding-top:8px; }
  .tcol{ flex:1; min-width:18px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .tbar{ width:70%; max-width:34px; background:linear-gradient(180deg,#5b8bff,#3b6ef5); border-radius:6px 6px 0 0; min-height:2px; }
  .tdate{ font-size:9px; color:var(--sub); margin-top:5px; white-space:nowrap; }
  .trend-svg{ width:100%; height:auto; display:block; touch-action:pan-y; }
  .t-wrap{ position:relative; }
  .t-tip{ position:absolute; transform:translate(-50%,-118%); background:#ff7a18; color:#fff; font-size:11px; font-weight:700; padding:4px 9px; border-radius:9px; white-space:nowrap; pointer-events:none; display:none; box-shadow:0 3px 10px rgba(255,122,24,.35); z-index:2; }
  .t-tip::after{ content:''; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%); border:5px solid transparent; border-top-color:#ff7a18; }
  .empty{ text-align:center; color:var(--sub); padding:30px; font-size:14px; }
  .err{ color:var(--red); padding:20px; text-align:center; }
  .refreshing{ opacity:.55; }
</style>
</head>
<body>
  <div class="top">
    <h1>📊 琪琪的专属</h1>
    <button class="refresh" id="refreshBtn">↻ 刷新</button>
  </div>
  <div class="sub" style="padding:0 4px 10px;"><span class="dot" id="dot"></span><span id="upd">加载中…</span></div>
  <div id="root"><div class="empty">正在加载销售数据…</div></div>

  <div class="section-t">今日各店铺业绩</div>
  <div id="stores"><div class="empty">加载中…</div></div>

  <div class="section-t" id="trendTitle">近30天每日成交额</div>
  <div id="trend" class="card" style="padding:12px;"><div class="empty">加载中…</div></div>
  <div id="trendNote" style="font-size:11px;color:var(--sub);padding:0 4px 6px;line-height:1.5;"></div>

<script>
const PLAT = { douyin:'抖店', pinduoduo:'拼多多', taobao:'淘宝' };
function money(n){ return '¥' + (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtK(v){ v=Number(v)||0; if(v>=10000) return (v/10000).toFixed(1)+'万'; if(v>=1000) return (v/1000).toFixed(1)+'k'; return Math.round(v).toString(); }
function smoothPath(pts){
  if(pts.length<2) return pts.length ? 'M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1) : '';
  let d='M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);
  }
  return d;
}
function render(d){
  if(d.error){ document.getElementById('root').innerHTML='<div class="err">'+d.error+'</div>'; document.getElementById('stores').innerHTML=''; document.getElementById('trend').innerHTML=''; return; }
  function daysInRange(daily, start, end){
    return (daily||[]).filter(x => x.date >= start && x.date <= end && Number(x.amount) > 0).length;
  }
  const card = (title,key,days)=>{
    const r=d.platforms[key];
    const dy=r.byPlatform.douyin, pdd=r.byPlatform.pinduoduo;
    const dayTag = (days && days > 0) ? '<span style="font-size:11px;color:var(--sub);font-weight:400;"> · 已累计 '+days+' 天</span>' : '';
    return '<div class="card"><div class="title">'+title+dayTag+'</div>'+
      '<div class="big"><span class="num">'+money(r.total.amount)+'</span><span class="unit">成交额</span></div>'+
      '<div class="cnt">成交订单 '+r.total.count+' 笔</div>'+
      '<div class="split">'+
        '<div><div class="p">抖店</div><div class="v">'+money(dy.amount)+'</div><div class="cnt">'+dy.count+'笔</div></div>'+
        '<div><div class="p">拼多多</div><div class="v">'+money(pdd.amount)+'</div><div class="cnt">'+pdd.count+'笔</div></div>'+
      '</div></div>';
  };
  const d7start = (d.range7||'').split(' ~ ')[0] || d.today;
  const d30start = (d.range30||'').split(' ~ ')[0] || d.today;
  document.getElementById('root').innerHTML =
    card('今日（'+d.today+'）','today', 1) +
    card('近 7 天（'+d.range7+'）','d7', daysInRange(d.daily, d7start, d.today)) +
    card('近 30 天（'+d.range30+'）','d30', daysInRange(d.daily, d30start, d.today));

  const st = d.stores||[];
  if(!st.length){ document.getElementById('stores').innerHTML='<div class="empty">今日暂无店铺业绩</div>'; }
  else {
    document.getElementById('stores').innerHTML = st.map(s=>{
      const cls = s.platform==='douyin'?'douyin':s.platform==='pinduoduo'?'pinduoduo':s.platform==='taobao'?'taobao':'other';
      return '<div class="store"><span class="badge '+cls+'">'+(PLAT[s.platform]||s.platform)+'</span>'+
        '<span class="name">'+escapeHtml(s.name)+'</span>'+
        '<span class="val"><div class="amt">'+money(s.amount)+'</div><div class="cnt">'+s.count+' 笔</div></span></div>';
    }).join('');
  }

  const daily = d.daily||[];
  if(!daily.length){ document.getElementById('trend').innerHTML='<div class="empty">暂无趋势数据</div>'; }
  else {
    document.getElementById('trendTitle').textContent = '近30天每日成交额';
    const W=680, H=220, padL=12, padR=12, padT=28, padB=26;
    const iw=W-padL-padR, ih=H-padT-padB;
    const vals=daily.map(x=>x.amount);
    const rawMax=Math.max.apply(null, vals.concat([1]));
    const rawMin=Math.min.apply(null, vals.concat([0]));
    const baseMin=0;
    const topMax = rawMax===rawMin ? rawMax*1.18 : rawMax;
    const n=daily.length;
    const X=i=> padL + (n<=1? iw/2 : (i/(n-1))*iw);
    const Y=v=> padT + ih - ((v-baseMin)/(topMax-baseMin||1))*ih;
    const pts=daily.map((x,i)=>({ x:X(i), y:Y(x.amount), v:x.amount, d:x.date }));
    const line=smoothPath(pts);
    const area=line+' L'+pts[n-1].x.toFixed(1)+','+(padT+ih)+' L'+pts[0].x.toFixed(1)+','+(padT+ih)+' Z';
    let grid='';
    const gl=3;
    for(let g=0;g<=gl;g++){
      const yy=padT+(ih/g)*g;
      const val=topMax-(topMax-baseMin)*(g/gl);
      grid+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#eef0f3" stroke-width="1"/>'+
            '<text x="'+(W-padR)+'" y="'+(yy-3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#b0b5bd">'+fmtK(val)+'</text>';
    }
    let xlab='';
    pts.forEach((p,i)=>{
      if(i%5===0 || i===n-1){
        let anc='middle', xx=p.x;
        if(i===0){ anc='start'; xx=padL; } else if(i===n-1){ anc='end'; xx=W-padR; }
        xlab+='<text x="'+xx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anc+'" font-size="9" fill="#8a9099">'+p.d.slice(5)+'</text>';
      }
    });
    let peakIdx=0; pts.forEach((p,i)=>{ if(p.v>pts[peakIdx].v) peakIdx=i; });
    const svg='<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
      '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#3b6ef5" stop-opacity="0.30"/>'+
      '<stop offset="100%" stop-color="#3b6ef5" stop-opacity="0.02"/></linearGradient></defs>'+
      grid+
      '<path d="'+area+'" fill="url(#areaGrad)"/>'+
      '<path d="'+line+'" fill="none" stroke="#3b6ef5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<circle id="tDot" r="5" fill="#ff7a18" stroke="#fff" stroke-width="2.5" style="display:none"/>'+
      xlab+'</svg>';
    const wrap='<div class="t-wrap">'+svg+'<div id="tTip" class="t-tip"></div></div>';
    const trendEl=document.getElementById('trend');
    trendEl.innerHTML=wrap;
    const svgEl=trendEl.querySelector('.trend-svg');
    const dot=document.getElementById('tDot');
    const tip=document.getElementById('tTip');
    function show(idx){
      const p=pts[idx];
      dot.setAttribute('cx', p.x.toFixed(1));
      dot.setAttribute('cy', p.y.toFixed(1));
      dot.style.display='';
      tip.textContent=p.d+'  '+money(p.v);
      tip.style.display='block';
      const wrapW = svgEl.clientWidth || trendEl.clientWidth || 1;
      const tipW = tip.offsetWidth || 0;
      let xPx = (p.x / W) * wrapW;
      xPx = Math.max(tipW/2 + 2, Math.min(wrapW - tipW/2 - 2, xPx));
      tip.style.left = xPx + 'px';
      tip.style.top = (p.y/H*100) + '%';
    }
    trendEl.onpointerdown=function(e){
      const r=svgEl.getBoundingClientRect();
      if(!r.width) return;
      const cx = e.clientX!=null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const px=(cx - r.left)/r.width;
      let idx=Math.round(((px*W - padL)/iw)*(n-1));
      idx=Math.max(0, Math.min(n-1, idx));
      show(idx);
    };
    show(peakIdx);
  }
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let timer=null;
function tick(){
  document.body.classList.add('refreshing');
  fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
    render(d);
    const t = d.updatedAt? new Date(d.updatedAt).toLocaleString('zh-CN') : '—';
    document.getElementById('upd').textContent = '更新于 '+t;
    document.getElementById('dot').className='dot';
  }).catch(e=>{
    document.getElementById('dot').className='dot off';
    document.getElementById('upd').textContent='刷新失败，将自动重试';
  }).finally(()=>{ document.body.classList.remove('refreshing'); });
}
function startTimer(){ if(timer) clearInterval(timer); timer = setInterval(tick, 30000); }
document.getElementById('refreshBtn').addEventListener('click', tick);
tick();
startTimer();
// 手机锁屏/后台/切标签后回到前台，立即刷新并重置定时器
// 浏览器在后台会节流 setInterval，仅靠 30 秒轮询不够，必须补这些事件
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ tick(); startTimer(); } });
window.addEventListener('pageshow', ()=> tick());
window.addEventListener('focus', ()=> tick());
window.addEventListener('online', ()=> tick());
</script>
</body>
</html>
