<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>琪琪的专属 · 销售看板</title>
<style>
  :root{ --bg:#fff5f7; --card:#ffffff; --pink:#ff6b9d; --pink2:#ff8fab; --pink3:#ffc2d1; --pink-light:#fff0f3; --text:#5c3a44; --sub:#b08c99; --line:#ffe6ec; --green:#ff85a1; --shadow:0 8px 24px rgba(255,107,157,.12); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:linear-gradient(180deg,#fff8fa 0%,#fff0f3 100%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom)); overflow-x:hidden; min-height:100vh; }
  .header{ display:flex; align-items:center; gap:12px; padding:18px 4px 14px; }
  .logo{ width:54px;height:54px;border-radius:18px;object-fit:cover;background:#fff;box-shadow:0 4px 16px rgba(255,107,157,.22); border:2px solid #fff; flex:none; }
  .brand{ flex:1; min-width:0; }
  .brand h1{ font-size:22px; margin:0; font-weight:800; background:linear-gradient(135deg,#ff4081,#ff6b9d); -webkit-background-clip:text; color:transparent; letter-spacing:.5px; }
  .brand .tag{ font-size:12px; color:var(--sub); margin-top:3px; font-weight:600; }
  .dot{ width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;vertical-align:middle; box-shadow:0 0 0 3px rgba(255,133,161,.28); }
  .dot.off{ background:#e2d5d9; box-shadow:none; }
  .sub{ font-size:12px;color:var(--sub); }
  .refresh{ border:none; background:linear-gradient(135deg,#ff6b9d,#ff8fab); color:#fff; font-size:13px; font-weight:700; padding:8px 16px; border-radius:50px; box-shadow:0 4px 14px rgba(255,107,157,.35); flex:none; }
  .refresh:active{ transform:scale(.96); opacity:.9; }
  .cards{ display:grid; grid-template-columns:1fr; gap:14px; }
  .card{ background:var(--card); border-radius:22px; padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .card::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#ff6b9d,#ff8fab,#ffc2d1); }
  .card .title{ font-size:13px;color:var(--sub);margin-bottom:12px; display:flex; align-items:center; gap:6px; font-weight:700; }
  .card .title::before{ content:'🎀'; font-size:12px; }
  .big{ display:flex; align-items:baseline; gap:8px; }
  .big .num{ font-size:32px; font-weight:800; background:linear-gradient(135deg,#ff4081,#ff6b9d); -webkit-background-clip:text; color:transparent; letter-spacing:-1px; }
  .big .unit{ font-size:13px;color:var(--sub); font-weight:600; }
  .cnt{ font-size:13px;color:var(--sub);margin-top:6px; font-weight:600; }
  .split{ display:flex; gap:10px; margin-top:14px; }
  .split > div{ flex:1; background:var(--pink-light); border-radius:14px; padding:12px; }
  .split .p{ font-size:12px;color:var(--sub); }
  .split .v{ font-size:15px;font-weight:800;margin-top:2px; color:var(--pink); }
  .section-t{ font-size:15px;font-weight:800;margin:22px 4px 10px; color:var(--text); display:flex; align-items:center; gap:6px; }
  .section-t::before{ content:'💖'; font-size:13px; }
  .store{ background:var(--card); border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 2px 12px rgba(255,107,157,.08); display:flex; align-items:center; gap:12px; }
  .store .badge{ font-size:11px; font-weight:800; color:#fff; border-radius:50px; padding:4px 10px; flex:none; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .badge.douyin{ background:linear-gradient(135deg,#ff6b9d,#ff4081); }
  .badge.pinduoduo{ background:linear-gradient(135deg,#ff85a1,#ffb3c6); }
  .badge.taobao{ background:linear-gradient(135deg,#ff9eb5,#ffc2d1); color:#8b4557; }
  .badge.other{ background:#d1bfc4; }
  .store .name{ flex:1; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .store .val{ text-align:right; }
  .store .amt{ font-size:15px; font-weight:800; background:linear-gradient(135deg,#ff4081,#ff6b9d); -webkit-background-clip:text; color:transparent; }
  .store .cnt{ font-size:11px; color:var(--sub); }
  .trend{ display:flex; align-items:flex-end; gap:4px; height:120px; overflow-x:auto; padding-top:8px; }
  .tcol{ flex:1; min-width:18px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .tbar{ width:70%; max-width:34px; background:linear-gradient(180deg,#ff85a1,#ff6b9d); border-radius:6px 6px 0 0; min-height:2px; }
  .tdate{ font-size:9px; color:var(--sub); margin-top:5px; white-space:nowrap; }
  .trend-svg{ width:100%; height:auto; display:block; touch-action:pan-y; }
  .t-wrap{ position:relative; }
  .t-tip{ position:absolute; transform:translate(-50%,-118%); background:linear-gradient(135deg,#ff6b9d,#ff4081); color:#fff; font-size:11px; font-weight:700; padding:4px 10px; border-radius:50px; white-space:nowrap; pointer-events:none; display:none; box-shadow:0 4px 14px rgba(255,64,129,.35); z-index:2; }
  .t-tip::after{ content:''; position:absolute; left:50%; bottom:-5px; transform:translateX(-50%); border:5px solid transparent; border-top-color:#ff4081; }
  .empty{ text-align:center; color:var(--sub); padding:34px; font-size:14px; }
  .err{ color:#ff4081; padding:20px; text-align:center; font-weight:600; }
  .delta{ font-size:13px; font-weight:800; margin-top:8px; display:flex; align-items:center; gap:5px; }
  .delta.up{ color:#ff3d6e; }
  .delta.down{ color:#2fb37a; }
  .delta.flat{ color:var(--sub); font-weight:600; font-size:12px; }
  .pshare-bar{ display:flex; height:14px; border-radius:50px; overflow:hidden; margin-bottom:14px; }
  .ps{ height:100%; }
  .ps-row{ display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; }
  .dotc{ width:10px;height:10px;border-radius:50%; flex:none; }
  .ps-name{ flex:1; color:var(--text); font-weight:700; }
  .ps-val{ color:var(--sub); font-weight:700; }
  .rank{ background:var(--card); border-radius:16px; padding:13px 14px; margin-bottom:10px; box-shadow:0 2px 12px rgba(255,107,157,.08); }
  .r-top{ display:flex; align-items:center; gap:8px; }
  .r-top .badge{ font-size:10px; padding:3px 8px; }
  .r-name{ flex:1; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .r-amt{ font-size:14px; font-weight:800; background:linear-gradient(135deg,#ff4081,#ff6b9d); -webkit-background-clip:text; color:transparent; }
  .r-bar{ height:8px; background:var(--pink-light); border-radius:50px; margin:9px 0 4px; overflow:hidden; }
  .r-fill{ height:100%; background:linear-gradient(90deg,#ff8fab,#ff6b9d); border-radius:50px; }
  .r-cnt{ font-size:11px; color:var(--sub); }
  .hl-wrap{ display:flex; gap:12px; }
  .hl{ flex:1; background:var(--card); border-radius:18px; padding:16px; text-align:center; box-shadow:var(--shadow); }
  .hl.best{ background:linear-gradient(135deg,#fff0f5,#ffe3ec); }
  .hl.worst{ background:linear-gradient(135deg,#f3f6ff,#eef1fb); }
  .hl-t{ font-size:12px; color:var(--sub); font-weight:700; }
  .hl-d{ font-size:13px; color:var(--text); font-weight:800; margin:6px 0 2px; }
  .hl-a{ font-size:18px; font-weight:800; background:linear-gradient(135deg,#ff4081,#ff6b9d); -webkit-background-clip:text; color:transparent; }
  .hl.worst .hl-a{ background:linear-gradient(135deg,#7c8cf0,#9aa8f5); -webkit-background-clip:text; color:transparent; }
  .refreshing{ opacity:.6; }
  .profit-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .profit-card{ background:var(--card); border-radius:18px; padding:15px 16px; box-shadow:var(--shadow); border-left:4px solid #ff6b9d; }
  .profit-card.pending{ border-left-color:#f0b05c; }
  .profit-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .profit-head b{ font-size:14px; }
  .profit-status{ font-size:10px; font-weight:800; padding:3px 8px; border-radius:50px; background:#eaf9f0; color:#28a66a; }
  .profit-card.pending .profit-status{ background:#fff3df; color:#c47b24; }
  .profit-num{ font-size:25px; font-weight:850; color:#ff4f88; }
  .profit-meta{ display:flex; flex-wrap:wrap; gap:7px 13px; color:var(--sub); font-size:11px; margin-top:5px; line-height:1.45; }
  .profit-note{ font-size:11px; color:#b0783c; line-height:1.55; background:#fff8ed; border-radius:10px; padding:8px 9px; margin-top:7px; }
</style>
</head>
<body>
  <div class="header">
    <img src="./logo.jpg" class="logo" alt="Qi Studio">
    <div class="brand">
      <h1>琪琪的专属</h1>
      <div class="tag">Qi Studio · 销售看板</div>
    </div>
    <button class="refresh" id="refreshBtn">↻ 刷新</button>
  </div>
  <div class="sub" style="padding:0 4px 14px;"><span class="dot" id="dot"></span><span id="upd">加载中…</span></div>
  <div id="root"><div class="empty">正在加载销售数据…</div></div>

  <div class="section-t" id="profitTitle">商品毛利（成本按 60% 估算）</div>
  <div id="profit"><div class="empty">正在加载利润数据…</div></div>

  <div class="section-t">今日各店铺业绩</div>
  <div id="stores"><div class="empty">加载中…</div></div>

  <div class="section-t" id="rankTitle" style="display:none;">🏅 近30天店铺累计</div>
  <div id="rank"></div>

  <div class="section-t" id="shareTitle" style="display:none;">💗 平台成交占比</div>
  <div id="share"></div>

  <div class="section-t" id="hlTitle" style="display:none;">✨ 本月高光时刻</div>
  <div id="hl"></div>

  <div class="section-t" id="trendTitle">近30天每日成交额</div>
  <div id="trend" class="card" style="padding:12px;"><div class="empty">加载中…</div></div>
  <div id="trendNote" style="font-size:11px;color:var(--sub);padding:0 4px 6px;line-height:1.5;"></div>

<script>
const PLAT = { douyin:'抖店', pinduoduo:'拼多多', taobao:'淘宝' };
const SHARE_COLOR = { douyin:'#ff6b9d', pinduoduo:'#ffb3c6', taobao:'#ffd6e0', other:'#d1bfc4' };
function shareColor(p){ return SHARE_COLOR[p] || '#d1bfc4'; }
function money(n){ return '¥' + (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtK(v){ v=Number(v)||0; if(v>=10000) return (v/10000).toFixed(1)+'万'; if(v>=1000) return (v/1000).toFixed(1)+'k'; return Math.round(v).toString(); }
function smoothPath(pts){
  if(pts.length<2) return pts.length ? 'M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1) : '';
  let d='M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);
  }
  return d;
}
function renderProfit(d){
  const root=document.getElementById('profit');
  const summary=d.profit;
  if(!summary || !summary.ranges){
    root.innerHTML='<div class="profit-card pending"><div class="profit-head"><b>利润数据暂不可用</b><span class="profit-status">等待电脑同步</span></div><div class="profit-note">'+escapeHtml(d.profitError||'请保持电脑端聚售台运行，利润数据会自动同步。')+'</div></div>';
    return;
  }
  const rows=[['今天','today'],['近7天','d7'],['近30天','d30']];
  const statusText={missing_orders:'订单明细未齐',missing_cost:'成本未齐',order_mismatch:'订单数量待核对',no_sales:'暂无成交'};
  root.innerHTML='<div class="profit-grid">'+rows.map(([label,key])=>{
    const r=summary.ranges[key];
    if(!r) return '';
    const isFlat = r.basis==='flat_60';
    if(r.status==='exact'){
      const badge = isFlat ? '60% 估算' : '已精确核对';
      const cnt = (r.capturedOrders||0);
      return '<div class="profit-card'+(isFlat?' pending':'')+'"><div class="profit-head"><b>'+label+'商品毛利</b><span class="profit-status">'+badge+'</span></div><div class="profit-num">'+money(r.grossProfit)+'</div><div class="profit-meta"><span>毛利率 '+Number(r.grossMargin||0).toFixed(1)+'%</span><span>成交 '+money(r.revenue)+'</span><span>成本 '+money(r.productCost)+'</span>'+(cnt>0?'<span>订单 '+cnt+' 笔</span>':'')+'</div></div>';
    }
    return '<div class="profit-card pending"><div class="profit-head"><b>'+label+'商品毛利</b><span class="profit-status">'+(statusText[r.status]||'待核对')+'</span></div><div class="profit-num" style="font-size:19px;color:#c47b24">暂不显示利润</div><div class="profit-meta"><span>成交 '+money(r.revenue)+'</span><span>订单覆盖 '+Number(r.orderCoverage||0).toFixed(1)+'%</span></div><div class="profit-note">缺失数据不会按 0 成本计算；电脑端补齐订单明细后自动显示精确商品毛利。</div></div>';
  }).join('')+'</div>'+(summary.note?'<div class="profit-note" style="margin-top:8px;">'+escapeHtml(summary.note)+'</div>':'');
}
function render(d){
  if(d.error){ document.getElementById('root').innerHTML='<div class="err">'+d.error+'</div>'; document.getElementById('stores').innerHTML=''; document.getElementById('trend').innerHTML=''; return; }
  function daysInRange(daily, start, end){
    return (daily||[]).filter(x => x.date >= start && x.date <= end && x.complete).length;
  }
  const card = (title,key,days)=>{
    const r=d.platforms[key];
    const dy=r.byPlatform.douyin, pdd=r.byPlatform.pinduoduo;
    const cov=r.coverage||{};
    const dayTag = '<span style="font-size:11px;color:'+(cov.complete?'#28a66a':'#c47b24')+';font-weight:600;"> · '+(cov.complete?'数据完整':'部分数据 '+Number(cov.percentage||0).toFixed(1)+'%')+'</span>';
    const count = r.total.count||0;
    const avg = count>0 ? r.total.amount/count : 0;
    const prevAmt = r.prev ? (r.prev.total.amount||0) : 0;
    let delta = '';
    if (prevAmt > 0 && cov.complete && r.prev?.coverage?.complete) {
      const pct = (r.total.amount - prevAmt) / prevAmt * 100;
      const cls = pct > 0.05 ? 'up' : pct < -0.05 ? 'down' : 'flat';
      const arrow = pct > 0.05 ? '▲' : pct < -0.05 ? '▼' : '—';
      delta = '<div class="delta '+cls+'">'+arrow+' '+Math.abs(pct).toFixed(1)+'% <span style="opacity:.7;font-weight:600;">较上一周期</span></div>';
    } else {
      delta = '<div class="delta flat">'+(cov.complete?'暂无完整对比数据':'缺失日期未按 0 元计算')+'</div>';
    }
    return '<div class="card"><div class="title">'+title+dayTag+'</div>'+
      '<div class="big"><span class="num">'+money(r.total.amount)+'</span><span class="unit">成交额</span></div>'+
      '<div class="cnt">成交订单 '+count+' 笔 · 单笔均 '+money(avg)+'</div>'+
      delta +
      '<div class="split">'+
        '<div><div class="p">抖店</div><div class="v">'+money(dy.amount)+'</div><div class="cnt">'+dy.count+'笔</div></div>'+
        '<div><div class="p">拼多多</div><div class="v">'+money(pdd.amount)+'</div><div class="cnt">'+pdd.count+'笔</div></div>'+
      '</div></div>';
  };
  const d7start = (d.range7||'').split(' ~ ')[0] || d.today;
  const d30start = (d.range30||'').split(' ~ ')[0] || d.today;
  document.getElementById('root').innerHTML =
    card('今日（'+d.today+'）','today', 1) +
    card('近 7 天（'+d.range7+'）','d7', daysInRange(d.daily, d7start, d.today)) +
    card('近 30 天（'+d.range30+'）','d30', daysInRange(d.daily, d30start, d.today));
  renderProfit(d);

  const st = d.stores||[];
  if(!st.length){ document.getElementById('stores').innerHTML='<div class="empty">今日暂无店铺业绩</div>'; }
  else {
    document.getElementById('stores').innerHTML = st.map(s=>{
      const cls = s.platform==='douyin'?'douyin':s.platform==='pinduoduo'?'pinduoduo':s.platform==='taobao'?'taobao':'other';
      return '<div class="store"><span class="badge '+cls+'">'+(PLAT[s.platform]||s.platform)+'</span>'+
        '<span class="name">'+escapeHtml(s.name)+'</span>'+
        '<span class="val"><div class="amt">'+money(s.amount)+'</div><div class="cnt">'+s.count+' 笔</div></span></div>';
    }).join('');
  }

  // 近30天店铺累计排行
  const s30 = d.stores30||[];
  if(s30.length){
    const max = Math.max.apply(null, s30.map(x=>x.amount).concat([1]));
    document.getElementById('rank').innerHTML = s30.map((s,i)=>{
      const cls = s.platform==='douyin'?'douyin':s.platform==='pinduoduo'?'pinduoduo':s.platform==='taobao'?'taobao':'other';
      const w = Math.max(4, s.amount/max*100);
      return '<div class="rank"><div class="r-top"><span class="badge '+cls+'">'+(i+1)+' · '+(PLAT[s.platform]||s.platform)+'</span>'+
        '<span class="r-name">'+escapeHtml(s.name)+'</span>'+
        '<span class="r-amt">'+money(s.amount)+'</span></div>'+
        '<div class="r-bar"><div class="r-fill" style="width:'+w+'%"></div></div>'+
        '<div class="r-cnt">'+s.count+' 笔</div></div>';
    }).join('');
    document.getElementById('rankTitle').style.display='';
  } else { document.getElementById('rankTitle').style.display='none'; document.getElementById('rank').innerHTML=''; }

  // 平台成交占比
  const ps = d.platformShare||[];
  if(ps.length){
    document.getElementById('share').innerHTML = '<div class="card" style="padding:16px;">'+
      '<div class="pshare-bar">'+ps.map(p=>'<div class="ps" style="width:'+p.share+'%;background:'+shareColor(p.platform)+'"></div>').join('')+'</div>'+
      ps.map(p=>'<div class="ps-row"><span class="dotc" style="background:'+shareColor(p.platform)+'"></span><span class="ps-name">'+(PLAT[p.platform]||p.platform)+'</span><span class="ps-val">'+money(p.amount)+' · '+p.share+'%</span></div>').join('')+
      '</div>';
    document.getElementById('shareTitle').style.display='';
  } else { document.getElementById('shareTitle').style.display='none'; document.getElementById('share').innerHTML=''; }

  // 本月高光时刻
  const hl = d.highlight||{};
  if(hl.best && hl.worst){
    document.getElementById('hl').innerHTML = '<div class="hl-wrap"><div class="hl best"><div class="hl-t">🏆 最佳日</div><div class="hl-d">'+hl.best.date+'</div><div class="hl-a">'+money(hl.best.amount)+'</div></div>'+
      '<div class="hl worst"><div class="hl-t">🌧 最淡日</div><div class="hl-d">'+hl.worst.date+'</div><div class="hl-a">'+money(hl.worst.amount)+'</div></div></div>';
    document.getElementById('hlTitle').style.display='';
  } else { document.getElementById('hlTitle').style.display='none'; document.getElementById('hl').innerHTML=''; }

  const daily = d.daily||[];
  if(!daily.length){ document.getElementById('trend').innerHTML='<div class="empty">暂无趋势数据</div>'; }
  else {
    document.getElementById('trendTitle').textContent = '近30天每日成交额';
    const history=d.salesHistory||{};
    document.getElementById('trendNote').textContent = history.complete
      ? '30 天 × 全部店铺均已由平台返回；0 元表示平台确认当天无成交。'
      : '当前仅有 '+Number(history.capturedStoreDays||0)+'/'+Number(history.expectedStoreDays||0)+' 个店铺日（'+Number(history.coverage||0).toFixed(1)+'%）；缺失日期不按 0 元连接。';
    const W=680, H=220, padL=12, padR=12, padT=28, padB=26;
    const iw=W-padL-padR, ih=H-padT-padB;
    const vals=daily.filter(x=>x.complete).map(x=>x.amount);
    const rawMax=Math.max.apply(null, vals.concat([1]));
    const rawMin=Math.min.apply(null, vals.concat([0]));
    const baseMin=0;
    const topMax = rawMax===rawMin ? rawMax*1.18 : rawMax;
    const n=daily.length;
    const X=i=> padL + (n<=1? iw/2 : (i/(n-1))*iw);
    const Y=v=> padT + ih - ((v-baseMin)/(topMax-baseMin||1))*ih;
    const pts=daily.map((x,i)=>({ x:X(i), y:Y(x.complete?x.amount:0), v:x.amount, d:x.date, complete:Boolean(x.complete), capturedStores:x.capturedStores, expectedStores:x.expectedStores }));
    const segments=[];
    let current=[];
    pts.forEach((point)=>{ if(point.complete) current.push(point); else if(current.length){ segments.push(current); current=[]; } });
    if(current.length) segments.push(current);
    const line=segments.map(smoothPath).join(' ');
    const area=segments.filter(seg=>seg.length>1).map(seg=>smoothPath(seg)+' L'+seg[seg.length-1].x.toFixed(1)+','+(padT+ih)+' L'+seg[0].x.toFixed(1)+','+(padT+ih)+' Z').join(' ');
    const missingMarks=pts.filter(p=>!p.complete).map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+(padT+ih-4)+'" r="3" fill="#e4a853"/>').join('');
    let grid='';
    const gl=3;
    for(let g=0;g<=gl;g++){
      const yy=padT+(ih/gl)*g;
      const val=topMax-(topMax-baseMin)*(g/gl);
      grid+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="#ffe6ec" stroke-width="1"/>'+
            '<text x="'+(W-padR)+'" y="'+(yy-3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#d6b0bd">'+fmtK(val)+'</text>';
    }
    let xlab='';
    pts.forEach((p,i)=>{
      if(i%5===0 || i===n-1){
        let anc='middle', xx=p.x;
        if(i===0){ anc='start'; xx=padL; } else if(i===n-1){ anc='end'; xx=W-padR; }
        xlab+='<text x="'+xx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anc+'" font-size="9" fill="#b08c99">'+p.d.slice(5)+'</text>';
      }
    });
    let peakIdx=Math.max(0,pts.findIndex(p=>p.complete)); pts.forEach((p,i)=>{ if(p.complete && (!pts[peakIdx]?.complete || p.v>pts[peakIdx].v)) peakIdx=i; });
    const svg='<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
      '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.32"/>'+
      '<stop offset="100%" stop-color="#ff6b9d" stop-opacity="0.03"/></linearGradient></defs>'+
      grid+
      '<path d="'+area+'" fill="url(#areaGrad)"/>'+
      '<path d="'+line+'" fill="none" stroke="#ff6b9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      missingMarks+
      '<circle id="tDot" r="5" fill="#ff4081" stroke="#fff" stroke-width="2.5" style="display:none"/>'+
      xlab+'</svg>';
    const wrap='<div class="t-wrap">'+svg+'<div id="tTip" class="t-tip"></div></div>';
    const trendEl=document.getElementById('trend');
    trendEl.innerHTML=wrap;
    const svgEl=trendEl.querySelector('.trend-svg');
    const dot=document.getElementById('tDot');
    const tip=document.getElementById('tTip');
    function show(idx){
      const p=pts[idx];
      dot.setAttribute('cx', p.x.toFixed(1));
      dot.setAttribute('cy', p.y.toFixed(1));
      dot.style.display='';
      tip.textContent=p.complete ? p.d+'  '+money(p.v) : p.d+'  数据缺失（'+Number(p.capturedStores||0)+'/'+Number(p.expectedStores||0)+' 家）';
      tip.style.display='block';
      const wrapW = svgEl.clientWidth || trendEl.clientWidth || 1;
      const tipW = tip.offsetWidth || 0;
      let xPx = (p.x / W) * wrapW;
      xPx = Math.max(tipW/2 + 2, Math.min(wrapW - tipW/2 - 2, xPx));
      tip.style.left = xPx + 'px';
      tip.style.top = (p.y/H*100) + '%';
    }
    trendEl.onpointerdown=function(e){
      const r=svgEl.getBoundingClientRect();
      if(!r.width) return;
      const cx = e.clientX!=null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const px=(cx - r.left)/r.width;
      let idx=Math.round(((px*W - padL)/iw)*(n-1));
      idx=Math.max(0, Math.min(n-1, idx));
      show(idx);
    };
    show(peakIdx);
  }
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let timer=null;
function tick(){
  document.body.classList.add('refreshing');
  fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
    render(d);
    const t = d.updatedAt? new Date(d.updatedAt).toLocaleString('zh-CN') : '—';
    document.getElementById('upd').textContent = '更新于 '+t;
    document.getElementById('dot').className='dot';
  }).catch(e=>{
    document.getElementById('dot').className='dot off';
    document.getElementById('upd').textContent='刷新失败，将自动重试';
  }).finally(()=>{ document.body.classList.remove('refreshing'); });
}
function startTimer(){ if(timer) clearInterval(timer); timer = setInterval(tick, 30000); }
document.getElementById('refreshBtn').addEventListener('click', tick);
tick();
startTimer();
// 手机锁屏/后台/切标签后回到前台，立即刷新并重置定时器
// 浏览器在后台会节流 setInterval，仅靠 30 秒轮询不够，必须补这些事件
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ tick(); startTimer(); } });
window.addEventListener('pageshow', ()=> tick());
window.addEventListener('focus', ()=> tick());
window.addEventListener('online', ()=> tick());
</script>
</body>
